<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<!-- Mobile-first: fyld telefonens skærm, ingen zoom nødvendig -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lønberegner</title>

<style>
  /* Ryddet side. Herfra bygger vi op igen, ét stykke ad gangen. */
  :root {
    --bg:    #f4f5f7;
    --card:  #ffffff;
    --ink:   #14181f;
    --muted: #5c6572;
    --line:  #dfe3e9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 520px; margin: 0 auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-top: 16px;
  }

  h1 { font-size: 1.35rem; margin: 4px 0 8px; }
  p  { color: var(--muted); margin: 0; }
</style>
</head>

<body>
<div class="wrap">
  <h1>Lønberegner</h1>

  <div class="card">
    <p>Siden er ryddet. Vi bygger den op igen forfra.</p>
  </div>
</div>
</body>
</html>
